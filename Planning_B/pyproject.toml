[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planning-b"
version = "0.3.0"
description = "Planning B: contract-aware search for subgoal order, EE, and fixed-tool resource transitions"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["planning_b*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
