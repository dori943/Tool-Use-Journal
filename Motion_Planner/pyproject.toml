[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-planner"
version = "0.6.0"
description = "Branch-preserving motion planning pipeline for the Task Planner contract"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.0",
    "numpy>=1.24",
    "task-planner",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "robosuite>=1.4",
]
vlm = [
    "openai>=2,<3",
]

[tool.setuptools.packages.find]
include = ["motion_planner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
